{% extends "base.html" %}

{% block title %}行程助手{% endblock %}
{% block heading %}行程助手{% endblock %}

{% block content %}
<section class="hero-panel compact">
  <p class="eyebrow">改动预览</p>
  <h2>先预览，再确认</h2>
  <p>先生成一份改动预览，确认无误后再保存到行程里。</p>
</section>

<section class="section">
  <h2>告诉助手要调整什么</h2>
  <form class="ai-form" data-ai-form>
    <textarea name="message" rows="5" placeholder="例如：记录午餐花了168；把今晚酒店改成明宇丽呈，状态改成已预订；矿泉水改成已购买。"></textarea>
    <button type="submit">生成调整预览</button>
  </form>
</section>

<section class="section" id="ai-result" hidden>
  <h2>调整预览</h2>
  <div class="proposal-box" data-proposal-box></div>
  <div class="action-row">
    <button type="button" data-confirm-proposal>保存到行程</button>
    <button type="button" class="secondary" data-clear-proposal>取消</button>
  </div>
</section>
{% endblock %}
