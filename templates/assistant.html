{% extends "base.html" %}

{% block title %}AI 助手{% endblock %}
{% block heading %}AI 行程助手{% endblock %}

{% block content %}
<section class="hero-panel compact">
  <p class="eyebrow">Preview First</p>
  <h2>先预览，再确认</h2>
  <p>模型只能生成待确认修改。点击确认后才会写入 JSON。</p>
</section>

<section class="section">
  <h2>告诉它要改什么</h2>
  <form class="ai-form" data-ai-form>
    <textarea name="message" rows="5" placeholder="例如：记录午餐花了168；把今晚酒店改成明宇丽呈，状态改成已预订；矿泉水改成已购买。"></textarea>
    <button type="submit">生成变更预览</button>
  </form>
</section>

<section class="section" id="ai-result" hidden>
  <h2>变更预览</h2>
  <div class="proposal-box" data-proposal-box></div>
  <div class="action-row">
    <button type="button" data-confirm-proposal>确认写入</button>
    <button type="button" class="secondary" data-clear-proposal>取消</button>
  </div>
</section>
{% endblock %}
